<title>Moonstone Monster Editor</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
#app { display: grid; height: 100%; grid-template-columns: 290px minmax(0, 1fr) 270px; grid-template-rows: 40px minmax(0, 1fr) 236px 22px; grid-template-areas: "top top top" "left center right" "bottom bottom bottom" "status status status"; min-width: 1100px; }
#app.home { grid-template-rows: 40px minmax(0, 1fr) 0 22px; grid-template-areas: "top top top" "home home home" "home home home" "status status status"; }
#app.home #left, #app.home #center, #app.home #right, #app.home #bottom { display: none; }
#app:not(.home) #homeview { display: none; }
#topbar { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel2); border-bottom: 1px solid var(--line); }
#homeview { grid-area: home; overflow: auto; padding: 14px 24px; }
#left { grid-area: left; overflow-y: auto; overflow-x: hidden; padding: 8px 10px; border-right: 1px solid var(--line); background: var(--panel); }
#center { grid-area: center; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#right { grid-area: right; overflow-y: auto; overflow-x: hidden; padding: 8px 10px; border-left: 1px solid var(--line); background: var(--panel); }
#bottom { grid-area: bottom; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--panel); min-height: 0; }
#statusbar { grid-area: status; background: var(--panel2); border-top: 1px solid var(--line); padding: 2px 10px; }
.status.err { color: var(--bad); } .status.ok { color: var(--ok); } .status.info { color: var(--dim); }
.brand { margin-right: 6px; }
.kname { font-weight: 600; color: var(--acc); }
.grow { flex: 1; }
.dim { color: var(--dim); } .small { font-size: 11.5px; } .mono { font-family: Consolas, monospace; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
button, select, input[type=text], input[type=number] { background: var(--btn); color: var(--text); border: 1px solid var(--btnline); border-radius: 4px; padding: 3px 8px; font: inherit; }
button { cursor: pointer; }
button:hover:not(:disabled) { background: var(--btnhov); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--accbg); border-color: var(--acc); }
button.tool.on, .tab.on { background: var(--accbg); border-color: var(--acc); }
input[type=number] { width: 64px; }
input.wide, label.wide input { width: 100%; }
label { display: inline-flex; align-items: center; gap: 4px; }
label.chk { gap: 3px; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--chipbg); color: var(--dim); }
.badge.ok { background: var(--okbg); color: var(--ok); } .badge.bad { background: var(--badbg); color: var(--badtxt); }
.panelhead { margin: 10px 0 4px; font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); display: flex; gap: 8px; align-items: center; }
.panelhead:first-child { margin-top: 0; }
.aisum { margin: 6px 0; font-size: 12px; color: var(--text2); }
select { max-width: 100%; }
/* checklist */
.checklist { display: flex; flex-direction: column; gap: 4px; }
.crow { display: flex; gap: 7px; padding: 4px 6px; border-radius: 4px; background: var(--panel2); border-left: 4px solid var(--mute); }
.crow.ok { border-left-color: var(--ok); } .crow.bad { border-left-color: var(--bad); background: var(--badrow); } .crow.unk { border-left-color: var(--mute2); }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--mute2); }
.crow.ok .dot { background: var(--ok); } .crow.bad .dot { background: var(--bad); }
.cmain { flex: 1; min-width: 0; }
.cname { font-weight: 600; } .cdetail { font-size: 11px; color: var(--dim); word-break: break-word; }
.crow.bad .cdetail { color: var(--badtxt); }
.crow select { width: 100%; margin-top: 3px; font-size: 12px; padding: 1px 4px; }
.tablesel { display: flex; flex-wrap: wrap; gap: 3px 8px; margin-top: 3px; } .tablesel select { width: 115px; margin: 0; }
.numgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.numgrid.d9 { grid-template-columns: repeat(3, 1fr); }
.numf { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.numf.unused { opacity: .45; }
.numf.wide { display: flex; }
.small details, details { margin: 4px 0; }
summary { cursor: pointer; color: var(--dim); font-size: 12px; }
/* centre */
.tabs { display: flex; gap: 4px; padding: 6px 8px 0; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel2); }
.tabs.small { padding: 0; border: 0; background: none; flex-wrap: wrap; margin-bottom: 4px; }
.tab { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.tabbody { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--line); }
.canvaswrap { flex: 1; overflow: auto; padding: 10px; display: flex; align-items: flex-start; justify-content: flex-start; min-height: 0; background: var(--canvasbg); }
.canvaswrap.two { gap: 20px; }
.framecv { cursor: crosshair; image-rendering: pixelated; margin: auto; }
.sheetcv { image-rendering: pixelated; cursor: pointer; }
.hint { padding: 3px 10px; font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line); }
.empty { padding: 30px; text-align: center; color: var(--dim); }
/* right */
.framelist { display: flex; flex-wrap: wrap; gap: 4px; max-height: 190px; overflow-y: auto; padding: 4px; background: var(--listbg); border: 1px solid var(--line); border-radius: 4px; }
.fitem { width: 56px; padding: 2px; border: 2px solid transparent; border-radius: 4px; cursor: pointer; text-align: center; }
.fitem.on { border-color: var(--sel); background: var(--selbg); }
.thumb { height: 46px; display: flex; align-items: center; justify-content: center; background: repeating-conic-gradient(var(--chk1) 0 25%, var(--chk2) 0 50%) 0 0 / 8px 8px; }
.fid { font-size: 10px; color: var(--dim); }
.ptlist { display: flex; flex-direction: column; gap: 2px; max-height: 110px; overflow-y: auto; margin: 3px 0; }
.pt { display: flex; gap: 4px; align-items: center; } .pt input { width: 54px; padding: 1px 4px; }
.x { padding: 0 6px; }
.palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.sw { height: 24px; border: 1px solid var(--swline); position: relative; cursor: pointer; display: flex; align-items: flex-end; justify-content: flex-end; }
.sw span { font-size: 9px; background: var(--swlabel); color: var(--swtext); padding: 0 2px; }
.sw.sel { outline: 2px solid var(--sel); z-index: 2; }
.sw.forbidden { box-shadow: inset 0 0 0 2px var(--bad); }
.sw.region { opacity: .75; }
.sw.transparent { background-image: repeating-conic-gradient(var(--tr1) 0 25%, var(--tr2) 0 50%) !important; background-size: 8px 8px; }
.sw.own { box-shadow: inset 0 0 0 1px var(--ok); }
/* bottom */
.bbody { flex: 1; overflow: auto; padding: 4px 10px; min-height: 0; }
.animwrap { display: flex; gap: 14px; }
.animctl { display: flex; flex-direction: column; gap: 5px; width: 240px; flex: none; }
.animstage { flex: 1; min-width: 0; }
.animcv { width: 320px; height: 176px; image-rendering: pixelated; border: 1px solid var(--line); display: block; }
.animwrap { align-items: flex-start; }
.animstage { display: grid; grid-template-columns: 322px 1fr; grid-template-rows: auto 1fr; gap: 4px 12px; }
.animstage .small { grid-column: 2; grid-row: 1; }
.chips { grid-column: 2; grid-row: 2; display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; max-height: 170px; overflow-y: auto; }
.animcv { grid-row: 1 / 3; }
.chip { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel2); cursor: pointer; }
.chip.on { background: var(--accbg); border-color: var(--acc); }
.btnrow { display: flex; gap: 4px; }
.checkout > div { margin: 1px 0; }
.buildwrap { display: grid; grid-template-columns: 420px 1fr; gap: 20px; }
.buildctl { display: flex; flex-direction: column; gap: 6px; }
.ftab { border-collapse: collapse; font-size: 12px; margin-top: 4px; } .ftab th, .ftab td { border-bottom: 1px solid var(--line); padding: 2px 10px; text-align: left; } .ftab .r { text-align: right; }
/* home */
.home h2 { margin: 14px 0 6px; font-size: 16px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 1000px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.ctitle { font-size: 15px; font-weight: 700; }
.namein { width: 100%; }
.kitlist { display: flex; flex-direction: column; gap: 4px; max-width: 1000px; }
.kititem { display: flex; align-items: center; gap: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; }
/* Monster kit editor, web edition: theme tokens (light by default, dark by prefers-color-scheme or data-theme) and the
   layout overrides for the page (stacked panels at narrow widths).  The editor.css :root block is replaced by this one. */
:root {
  --bg: #f3f5f9; --panel: #ffffff; --panel2: #e8ecf4; --line: #c3cbdb; --text: #1b2230; --dim: #566178;
  --ok: #17803f; --bad: #c42626; --warn: #9a5700; --acc: #1a5fc4; --accbg: #d3e3ff;
  --btn: #eef1f7; --btnline: #a9b3c8; --btnhov: #dde4f1; --chipbg: #dfe5f0; --okbg: #d2f0de; --badbg: #fadada; --badtxt: #a31d1d;
  --text2: #3a455c; --badrow: #fdeeee; --canvasbg: #d5dbe8; --listbg: #eef1f7; --sel: #d18a00; --selbg: #fff1cf;
  --chk1: #cfd6e4; --chk2: #dde3ee; --tr1: #bbb; --tr2: #eee; --swline: #000; --swlabel: rgba(0, 0, 0, .6); --swtext: #fff; --mute: #8a93a6; --mute2: #9aa3b5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1b1f27; --panel2: #232833; --line: #333a49; --text: #dde3ef; --dim: #9aa4b9;
    --ok: #4cd37b; --bad: #ff5d5d; --warn: #ffb347; --acc: #4a9eff; --accbg: #1f4f8f;
    --btn: #2a3040; --btnline: #424b60; --btnhov: #343c50; --chipbg: #2e3547; --okbg: #1c4a2f; --badbg: #5a2020; --badtxt: #ff9a9a;
    --text2: #b8c2d8; --badrow: #2b2024; --canvasbg: #0f1217; --listbg: #11141a; --sel: #ffd24a; --selbg: #2a2a1a;
    --chk1: #262b36; --chk2: #2e3441; --tr1: #555; --tr2: #888; --swline: #000; --swlabel: rgba(0, 0, 0, .55); --swtext: #fff; --mute: #555; --mute2: #666;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --panel: #1b1f27; --panel2: #232833; --line: #333a49; --text: #dde3ef; --dim: #9aa4b9;
  --ok: #4cd37b; --bad: #ff5d5d; --warn: #ffb347; --acc: #4a9eff; --accbg: #1f4f8f;
  --btn: #2a3040; --btnline: #424b60; --btnhov: #343c50; --chipbg: #2e3547; --okbg: #1c4a2f; --badbg: #5a2020; --badtxt: #ff9a9a;
  --text2: #b8c2d8; --badrow: #2b2024; --canvasbg: #0f1217; --listbg: #11141a; --sel: #ffd24a; --selbg: #2a2a1a;
  --chk1: #262b36; --chk2: #2e3441; --tr1: #555; --tr2: #888; --swline: #000; --swlabel: rgba(0, 0, 0, .55); --swtext: #fff; --mute: #555; --mute2: #666;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--text); }
html, body { overflow: auto; height: auto; min-height: 100%; }
#app { height: 100vh; min-height: 640px; min-width: 0; position: relative; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
button, select, input, textarea, [tabindex] { font-family: inherit; }
textarea { background: var(--btn); color: var(--text); border: 1px solid var(--btnline); border-radius: 4px; }
.jsonbox { width: 100%; font: 11px/1.3 Consolas, monospace; resize: vertical; }
.badge.warn.exbadge { background: var(--selbg); color: var(--warn); border: 1px solid var(--warn); }
.confirmbar { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 20; max-width: min(640px, calc(100vw - 32px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: var(--panel); color: var(--text); border: 2px solid var(--warn); border-radius: 6px; box-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
#app.dropping::after { content: "Drop the kit here"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--panel2); opacity: .92; border: 3px dashed var(--acc); z-index: 30; pointer-events: none; }
.dropzone { max-width: 1000px; padding: 26px 16px; text-align: center; border: 2px dashed var(--btnline); border-radius: 8px; background: var(--panel); cursor: pointer; margin-bottom: 10px; }
.dropzone:hover { background: var(--panel2); }
.btnrow.wrap { flex-wrap: wrap; margin: 6px 0; }
.home ul { margin: 4px 0 8px 18px; padding: 0; }
.home p { max-width: 900px; }
.exportwrap { display: grid; grid-template-columns: minmax(280px, 420px) minmax(0, 1fr); gap: 20px; }
.exportctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.exsheets { display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; min-width: 0; }
.exsheet { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 100%; }
.imgwrap { max-width: 100%; overflow: auto; max-height: 220px; background: var(--canvasbg); border: 1px solid var(--line); }
.sheetimg { image-rendering: pixelated; display: block; }
a.btnlink { display: inline-block; padding: 3px 8px; border: 1px solid var(--btnline); border-radius: 4px; background: var(--btn); color: var(--text); text-decoration: none; }
a { color: var(--acc); }

@media (max-width: 1099px) {
  html, body { height: auto; }
  #app { display: flex; flex-direction: column; height: auto; min-height: 0; }
  #topbar { flex-wrap: wrap; height: auto; padding: 6px 16px; gap: 6px; }
  #homeview { padding: 14px 16px; overflow: visible; }
  #left, #right { border: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; overflow: visible; }
  #center { min-height: 380px; height: 70vh; }
  #bottom { min-height: 300px; border-top: 1px solid var(--line); }
  #statusbar { padding: 4px 16px; position: sticky; bottom: 0; }
  .bbody { padding: 6px 16px; overflow: visible; }
  .canvaswrap { max-height: none; }
  .tabs { flex-wrap: wrap; padding-left: 16px; padding-right: 16px; }
  .toolbar { padding-left: 16px; padding-right: 16px; }
  .animwrap { flex-direction: column; }
  .animctl { width: 100%; }
  .animstage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .animstage .small, .chips { grid-column: 1; grid-row: auto; }
  .animcv { grid-row: auto; width: 100%; max-width: 320px; height: auto; aspect-ratio: 320 / 176; }
  .exportwrap, .buildwrap { grid-template-columns: minmax(0, 1fr); }
  .cards { grid-template-columns: 1fr; }
  .kititem { flex-wrap: wrap; }
  .confirmbar { top: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}</style>

<script>
/* ---- core.js */
'use strict';
/* Monster kit editor, core: state, API client, small DOM helper, pixel/palette helpers.
   No original game data lives in these files: everything (pixels, palettes, scripts) arrives through /api from the local kits. */
const MK = {};
MK.S = {
  info: null, cat: null, name: null, kit: null, sheets: [], dirtyKit: false, dirtySheets: new Set(),
  cs: 0, fi: 0, tool: 'anchor', color: 1, zoom: 6, onion: 'prev', grid: true, hurt: false, gate: true,
  center: 'frame', bottom: 'anim', report: null, reportStale: true, undo: [], imp: null, ver: 0, busy: '', log: [],
  lastBuild: null, hd: '', animName: null,
};
MK.listeners = {};
MK.on = (ev, fn) => { (MK.listeners[ev] = MK.listeners[ev] || []).push(fn); };
MK.emit = (ev, arg) => { (MK.listeners[ev] || []).forEach((fn) => fn(arg)); };

/* ---- DOM */
MK.h = function (tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(2)) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
};
MK.$ = (s, r) => (r || document).querySelector(s);
MK.clear = (e) => { while (e.firstChild) e.removeChild(e.firstChild); return e; };

/* ---- API */
MK.api = async function (method, url, body) {
  const opt = { method, headers: { 'X-MonsterKit': '1' } };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(url, opt); } catch (e) { throw new Error('server not reachable (is `py tools/monsterkit.py serve` running?)'); }

<script>
/* ---- web_check.js */
'use strict';
/* Monster kit editor, web edition, part 2: the kit check in the browser.  A port of check_kit() of tools/monsterkit.py (the parts that

const WCHK = {};
WCHK.FORBIDDEN = [6, 7, 8];
WCHK.REGION = [].concat([1, 2, 3, 4, 5], Array.from({ length: 16 }, (_, i) => 16 + i));
const wordsOf = (w) => (w + 15) >> 4;
const popcount = (v) => { let n = 0; while (v) { n += v & 1; v >>>= 1; } return n; };

/* the normalised ops of an animation: from the verbatim asm, else built from the steps */
WCHK.animOps = function (kit, anim) {
  const ops = [], asm = anim.asm;
  if (asm) {
    let fs = 2;
    for (let line of asm.split('\n')) {
      line = line.split(';')[0].trim();
      if (!line || line.startsWith('.org') || line.endsWith(':')) continue;
      const w = line.split(/\s+/), m = /^draw (\d+) (\d+) dx=(-?\d+) dy=(-?\d+)(.*)$/.exec(line);

        ops.push({ op: 'draw', slot: +m[1], frame: +m[2], hurt: flags.includes('hurt'), attack: flags.includes('attack'), creature: fs === 2 });
      } else if (w[0] === 'frameset') fs = { knights: 1, creature: 2, map: 3, effects: 4 }[w[1]] || 0;
      else if (['ifdead', 'engine', 'jump', 'call'].includes(w[0])) ops.push({ op: w[0], target: w[1] });
      else if (w[0] === 'sound') ops.push({ op: 'sound', id: w[1].startsWith('$') ? parseInt(w[1].slice(1), 16) : parseInt(w[1], 10) });

  for (const cs of kit.celsets) cs.frames.forEach((fr, i) => { ids[fr.id] = [cs.slot, i]; });

    for (const d of st.draws) {

WCHK.maxTickArea = function (kit) {
  const dims = {};

WCHK.hitSetTextLength = function (cs) {

  let last = 0; fr.forEach((f, i) => { if (f) last = i + 1; });

WCHK.detectTier = function (kit) {
  const o = kit.origin;
  if (!o) return kit.cloned_from ? 't1' : 't2';
  let same = kit.celsets.length === o.celsets.length;
  if (same) {
    kit.celsets.forEach((cs, k) => {
      const oc = o.celsets[k];

    });

  return scripts ? 't1' : 't2';
};

/* kit: the kit.json object; sheets: [{w, h, data}]; cat / schema: the embedded catalog and schema */
WCHK.check = function (kit, sheets, cat, schema) {

  for (const cs of kit.celsets) {
    if (cs.frames.length > limits.frames_per_cel_file) err('slot ' + cs.slot + ': ' + cs.frames.length + ' frames, at most ' + limits.frames_per_cel_file);
    const ids = cs.frames.map((f) => f.id);
    if (new Set(ids).size !== ids.length) err('slot ' + cs.slot + ': duplicate frame ids');
    const ofs = (origin.celsets || []).find((oc) => oc.slot === cs.slot);
    const dims = [];

      if (!fr.src) { err('frame ' + fr.id + ' has no src'); return; }

      if (x + w > sh.w || y + h > sh.h) { err('frame ' + fr.id + ': rect ' + JSON.stringify(fr.src.rect) + ' lies outside sheet ' + fr.src.sheet + ' (' + sh.w + 'x' + sh.h + ')'); return; }

      if (h > limits.frame_size.bltsize.max_rows) err('frame ' + fr.id + ': height ' + h + ' above BLTSIZE limit');

      let mx = 0, orv = 0;
      for (let j = 0; j < h; j++) for (let k = 0; k < w; k++) { const v = sh.data[(y + j) * sh.w + x + k]; seen.add(v); if (v > mx) mx = v; orv |= v; }

        for (const [px, py] of pts) {

    if (agg[key]) warn(agg[key].length + ' ' + msg + agg[key].slice(0, 4).join(', ') + (agg[key].length > 4 ? ', ...' : ''));
  }

    warn('cel sets need ~' + arena + ' bytes of the creature arena (' + limits.creature_arena_bytes + '); a set living in the second area is budgeted there');
    if (arena > limits.creature_arena_bytes + limits.second_area_bytes) err('cel sets need ~' + arena + ' bytes, arena + second area hold ' + (limits.creature_arena_bytes + limits.second_area_bytes));

  const hasHurt = (name) => (opsOf[name] || []).some((o) => o.op === 'draw' && o.hurt);
  const gap = (msg) => { const inh = (origin.inherited_gaps || []).includes(msg); (inh ? warn : err)(msg + (inh ? ' [inherited from the source]' : '')); return inh; };
  const hurtRoots = [];
  for (const r of ai.roles) {
    const nm = r.name;

      const [a, ext] = resolve(kit.roles[nm]);
      if (r.required && !a) { rep.checklist.push({ role: nm, ok: false, detail: 'no animation (' + r.meaning + ')' }); err('role ' + nm + ' is missing: ' + r.meaning); continue; }
      if (!a) { rep.checklist.push({ role: nm, ok: true, detail: 'not set (optional)' }); continue; }

      }
      rep.checklist.push({ role: nm, ok, detail });
    } else {
      const req = r.required_indices || [];
      const arr = nm === 'hurt_by_action' ? kit.hurt_by_action : kit.roles[nm];
      const base = (nm === 'hurt_by_action' || nm === 'action') ? 0 : 8 * Math.floor((req.length ? Math.min(...req) : 0) / 8);
      if (!req.length) continue;
      const miss = [];
      for (const i of req) {
        const v = arr && i - base >= 0 && i - base < arr.length ? arr[i - base] : null;
        const [a, ext] = resolve(v);
        if (!a) miss.push(i);
        else if (!ext) {
          if (r.attack === 'required' && !hasAttack(a)) { gap('role ' + nm + '[' + i + '] (' + a + '): no attack draw with attack points'); miss.push(i); }
          if (nm === 'hurt_by_action') hurtRoots.push(a);
        }
      }
      if (miss.length) err('role ' + nm + ' is missing entries [' + miss.join(', ') + ']');
      rep.checklist.push({ role: nm, ok: !miss.length, detail: !miss.length ? 'entries [' + req.join(', ') + ']' : 'missing entries [' + miss.join(', ') + ']' });
    }
  }
  /* die: every hurt role jumps (ifdead) to a die sequence that counts the death once and kills the job */
  const [die] = resolve(kit.roles.die);
  if (!die) { rep.checklist.push({ role: 'die', ok: false, detail: 'no die sequence (ifdead target of the hurt roles)' }); err('role die is missing: the creature only dies through its scripts (hurt role: ifdead -> die sequence)'); }
  else {

    const kills = opsOf[die].filter((o) => o.op === 'kill').length, probs = [];
    if (engine.filter((t) => t === 'lab_0005').length !== 1 && !engine.includes('creature_died')) probs.push('must call engine LAB_0005 exactly once');
    if (kills !== 1) probs.push('must end with kill');
    probs.forEach((p) => err('die sequence ' + die + ' ' + p));
    rep.checklist.push({ role: 'die', ok: !probs.length, detail: !probs.length ? die : die + ': ' + probs.join('; ') });
  }
  for (const hname of [...new Set(hurtRoots)].sort()) {
    if (!(opsOf[hname] || []).some((o) => o.op === 'ifdead')) warn('hurt script ' + hname + ' has no ifdead: a creature hit by it cannot die');
  }
  void lmap;
  /* ---- tunables, frame rate proxy */
  for (const t of ai.tunables) {
    if (!t.used && kit.stats[t.name] !== undefined && kit.stats[t.name] !== null && origin.stats && kit.stats[t.name] !== origin.stats[t.name]) rep.info.push('stat ' + t.name + ' is not read by the ' + kit.ai + ' AI');
  }

  if (origin.max_tick_area && mta > 1.2 * origin.max_tick_area) warn('largest drawn area in one tick ' + mta + ' px is above 120% of the source (' + origin.max_tick_area + '): a slower fight frame');
  rep.tier = WCHK.detectTier(kit);
  return finish();
};

/* ---- web_example.js */
'use strict';
/* Monster kit editor, web edition, part 3: the example kit.  A small original blob creature drawn by code (ellipses, a shaded rim,
   two eyes), with the frames and animations the 'stalker' AI needs.  Nothing here comes from the game. */
const WEX = {};
WEX.NAME = 'example_blob';
WEX.TITLE = 'Example kit (not from the game)';
/* a neutral example palette (the real fight palette is a property of the loaded kit) */
WEX.palette = function () {
  const p = ['#000000', '#2b3340', '#3a4454', '#4b576b', '#5e6b82', '#74829b', '#7a4a4a', '#9a5c5c', '#b87070',
    '#1d3b2a', '#2f7d4f', '#46a86c', '#8fdc9c', '#f2f2e8', '#20202a', '#cc0000'];
  for (let i = 0; i < 16; i++) { const v = 40 + i * 12; p.push('#' + [v, v + 6, v + 14].map((c) => Math.min(255, c).toString(16).padStart(2, '0')).join('')); }
  return p;
};

const FW = 64, FH = 40, CX = 22;
/* one frame: indices 0 (transparent), 9 outline, 10..12 body shading, 13 eye white, 14 pupil / mouth */
WEX.blob = function (o) {
  const d = new Uint8Array(FW * FH), sq = o.squash || 0;
  const rx = 15 * (1 + sq * 0.8), ry = 15 * (1 - sq), cx = CX + (o.shift || 0), cy = FH - 2 - ry;
  const put = (x, y, v) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < FW && y >= 0 && y < FH) d[y * FW + x] = v; };
  if (o.arm) {                                   // a reaching arm: outlined band with a fist
    const y0 = Math.round(cy - 2 - (o.armUp || 0)), th = o.thick || 5, x1 = Math.min(FW - 2, Math.round(cx + rx * 0.6 + o.arm));
    for (let x = Math.round(cx); x <= x1; x++) for (let j = -1; j <= th; j++) put(x, y0 + j, j < 0 || j === th ? 9 : (j < 2 ? 12 : 11));
    for (let j = -2; j <= th + 1; j++) for (let k = 0; k < 5; k++) { const e = j < -1 || j > th; put(x1 - 3 + k, y0 + j, e || k === 4 ? 9 : 12); }
  }
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
    const nx = (x - cx) / rx, ny = (y - cy) / ry, q = nx * nx + ny * ny;
    if (q > 1) continue;
    if (q > 0.74) { d[y * FW + x] = 9; continue; }
    const t = -0.5 * nx - 0.7 * ny;
    d[y * FW + x] = t > 0.3 ? 12 : t > -0.2 ? 11 : 10;
  }
  const ey = Math.round(cy - ry * 0.2), look = o.look || 0;
  for (const s of [-1, 1]) {
    const ex = Math.round(cx + s * rx * 0.38 + look);
    if (o.dead || o.hurt) { for (let k = -2; k <= 2; k++) { put(ex + k, ey + k, 14); put(ex + k, ey - k, 14); } continue; }
    for (let j = -2; j <= 2; j++) for (let k = -2; k <= 2; k++) if (j * j + k * k <= 5) put(ex + k, ey + j, 13);
    put(ex + 1 + look, ey, 14); put(ex + 1 + look, ey + 1, 14);
  }

  for (let k = -mw; k <= mw; k++) { put(cx + k + look, my, 14); if (o.mouth) put(cx + k + look, my + 1, 14); }
  return d;
};

/* the frame list: [id, options, attack points or null] */
WEX.frameDefs = function () {
  const gb = (arm, up) => { const x = Math.min(FW - 3, Math.round(CX + 15 * 0.6 + arm)), y = Math.round(FH - 2 - 15 - 2 - (up || 0)); return [[x - 2, y + 2], [x, y + 2], [x - 1, y]]; };
  return [
    ['stand0', {}, null], ['stand1', { squash: 0.08 }, null],
    ['walk0', { shift: -1, squash: 0.04 }, null], ['walk1', { shift: 0, squash: 0.12 }, null], ['walk2', { shift: 1, squash: 0.04 }, null], ['walk3', { shift: 0, squash: 0.12, look: 1 }, null],
    ['strike0', { squash: 0.12, arm: 5, shift: -2 }, null], ['strike1', { arm: 22, mouth: true, look: 1 }, gb(22)],
    ['heavy0', { squash: 0.2, arm: 6, armUp: 6, thick: 7, shift: -3 }, null], ['heavy1', { arm: 26, armUp: 2, thick: 8, mouth: true, look: 2 }, gb(26, 2)],
    ['hurt0', { squash: 0.15, hurt: true, shift: -2 }, null],
    ['die0', { squash: 0.3, dead: true, shift: -2 }, null], ['die1', { squash: 0.5, dead: true, shift: -3 }, null], ['die2', { squash: 0.7, dead: true, shift: -3 }, null],
  ];
};

/* returns {kit, sheets: [{w, h, data}]} */
WEX.build = function () {
  const defs = WEX.frameDefs(), pad = 1, per = Math.floor(640 / (FW + pad));
  const rows = Math.ceil(defs.length / per), sw = 640, sh = rows * (FH + pad) - pad;
  const sheet = new Uint8Array(sw * sh), frames = [], idx = {};
  defs.forEach(([id, o, pts], i) => {
    const x = (i % per) * (FW + pad), y = Math.floor(i / per) * (FH + pad), px = WEX.blob(o);
    for (let j = 0; j < FH; j++) for (let k = 0; k < FW; k++) sheet[(y + j) * sw + x + k] = px[j * FW + k];
    const fr = { id, src: { sheet: 0, rect: [x, y, FW, FH] }, anchor: [CX + (o.shift || 0), FH - 2] };
    if (pts) fr.attack = { type: 0, points: pts };
    frames.push(fr); idx[id] = i;
  });
  const draw = (f, flags) => Object.assign({ frame: f, slot: 0, dx: 0, dy: 0, hurt: true }, flags || {});
  const step = (ticks, f, flags, move) => ({ ticks, draws: [draw(f, flags)], move: move || [0, 0, 0], sound: null, events: [] });
  const an = (steps, extra) => Object.assign({ loop: 0, steps, motion: null, on_dead: null, asm: null }, extra || {});
  const atk = { attack: true };
  const dieAsm = ['fall:', 'draw 0 ' + idx.die0 + ' dx=0 dy=0', 'end', 'end', 'end', 'draw 0 ' + idx.die1 + ' dx=0 dy=0', 'end', 'end', 'end',
    'draw 0 ' + idx.die2 + ' dx=0 dy=0', 'end', 'end', 'end', 'end', 'end', 'end', 'engine LAB_0005', 'kill', 'done'].join('\n');
  const kit = {
    kit: 1, name: WEX.NAME, title: WEX.TITLE, cloned_from: null, ai: 'stalker', planes: 5,
    palette: { scene: 'example', colors: WEX.palette(), own: { 9: '#1d3b2a', 10: '#2f7d4f', 11: '#46a86c', 12: '#8fdc9c', 13: '#f2f2e8', 14: '#20202a', 15: '#cc0000' }, allow: [0, 9, 10, 11, 12, 13, 14, 15] },
    sheets: [{ file: 'sheet.png', grid: { w: FW, h: FH, pad } }],
    celsets: [{ slot: 0, file: 'auto', hits: true, hit_name: 'blob0.cel', frames }],
    animations: {
      stand: an([step(3, 'stand0'), step(3, 'stand1')]),
      walk0: an([step(2, 'walk0', null, [16, 0, 0])]), walk1: an([step(2, 'walk1', null, [26, 0, 0])]),
      walk2: an([step(2, 'walk2', null, [13, 0, 0])]), walk3: an([step(2, 'walk3', null, [26, 0, 0])]),
      ouch: an([step(2, 'hurt0'), step(2, 'stand0')], { on_dead: 'fall' }),
      club: an([step(3, 'strike0'), step(2, 'strike1', atk), step(3, 'strike0')]),
      slam: an([step(4, 'heavy0'), step(2, 'heavy1', atk), step(4, 'heavy0')]),
      fall: an([step(3, 'die0'), step(3, 'die1'), step(6, 'die2', { hurt: false })], { asm: dieAsm }),
    },
    roles: { idle: 'stand', after_hit: 'stand', hurt: 'ouch', strike: 'club', heavy: 'slam', die: 'fall', 'walk.side': ['walk0', 'walk1', 'walk2', 'walk3', null, null, null, null] },
    damage: [0, 0, 0, 0, 0, 0, 0, 0, 0],
    stats: { hp: 30, reach: 60, keep_away: 30, depth: 5 },
    sounds: { bank: 'To.a' },
    arena: { alive_max: 1, total: 1, spawn: 'alternating', frame_budget: 6 },
    tier: 'auto',
  };
  return { kit, sheets: [{ file: 'sheet.png', w: sw, h: sh, data: sheet }] };
};
</script>
<script>
/* ---- web.js */
'use strict';
/* Monster kit editor, web edition, part 4: replaces the local server.  MK.api becomes an in-page store (kits opened from the
   viewer's disk or the generated example), the check runs in the browser, and "save" means copy kit.json / copy a PNG as a data URL
   (an Artifact sandbox blocks page-initiated downloads; a .zip link is offered as an extra).  Nothing leaves the page. */
(function () {
  const { S, h, $, clear } = MK;
  const W = MK.web = { store: {}, exampleName: WEX.NAME, msgs: [], pending: null, exp: null };
  const CAT = JSON.parse(document.getElementById('mk-catalog').textContent);
  const SCHEMA = JSON.parse(document.getElementById('mk-schema').textContent);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  /* ------------------------------------------------------------ the in-page API */
  const fail = (m) => { throw new Error(m); };
  const entry = (name) => W.store[name] || fail('no kit ' + name);

  async function snap(name, body) {
    const kit = (name === S.name && S.kit) ? S.kit : entry(name).kit;
    const bytes = MK.b64d(body.png), img = await WIO.imageRGBA(bytes);
    const pal = (kit.palette.colors || []).map((c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)));
    if (!pal.length) fail('this kit has no palette.colors to snap to');
    const allow = kit.palette.allow, ok = [];
    pal.forEach((_, i) => { if (i === 0 || !allow || allow.includes(i)) ok.push(i); });
    const n = img.w * img.h, data = new Uint8Array(n), changed = new Uint8Array(n);
    let opaque = 0, nchanged = 0, forbidden = 0;
    for (let i = 0; i < n; i++) {
      const r = img.rgba[i * 4], g = img.rgba[i * 4 + 1], b = img.rgba[i * 4 + 2];
      if (img.rgba[i * 4 + 3] < 128) continue;
      let best = 1e12, bi = 0;
      for (const k of ok) { const p = pal[k], d = (r - p[0]) ** 2 + (g - p[1]) ** 2 + (b - p[2]) ** 2 + (k === 0 ? 1 : 0); if (d < best) { best = d; bi = k; } }
      data[i] = bi; opaque += bi !== 0 ? 1 : 0;
      const p = pal[bi];
      if (p[0] !== r || p[1] !== g || p[2] !== b) { changed[i] = 1; nchanged++; }
      if (WCHK.FORBIDDEN.includes(bi)) forbidden++;
    }
    return { w: img.w, h: img.h, data: MK.b64e(data), changed: MK.b64e(changed), counts: { pixels: n, opaque, changed: nchanged, forbidden } };
  }

  MK.api = async function (method, url, body) {
    const p = url.split('?')[0].split('/').filter(Boolean);                // api, kit, <name>, ...
    if (method === 'GET' && p[1] === 'info') return { game: false, kits_root: 'this page', disks: '', hd_default: '', creatures: [], sheet_width: 640, kit_version: 1 };
    if (method === 'GET' && p[1] === 'catalog') return CAT;
    if (method === 'GET' && p[1] === 'kits') {
      return { kits: Object.values(W.store).map((e) => ({ name: e.kit.name, title: e.kit.title || '', ai: e.kit.ai, cloned_from: e.kit.cloned_from, celsets: e.kit.celsets.length, animations: Object.keys(e.kit.animations).length })) };
    }
    if (p[1] === 'kit' && p[2]) {
      const name = p[2], rest = p.slice(3);
      if (!rest.length && method === 'GET') return clone(entry(name).kit);
      if (!rest.length && method === 'PUT') {
        const errs = WIO.validate(body, SCHEMA);
        if (errs.length) fail('schema: ' + errs.slice(0, 8).join('; '));
        const e = entry(name); if (!body.origin && e.kit.origin) body.origin = e.kit.origin;
        e.kit = clone(body); return { ok: true };
      }
      if (rest[0] === 'sheet' && /^\d+$/.test(rest[1])) {
        const e = entry(name), n = +rest[1];
        if (method === 'GET') { const s = e.sheets[n] || fail('kit ' + name + ' has no sheet ' + n); return { w: s.w, h: s.h, data: MK.b64e(s.data) }; }
        if (method === 'PUT') { e.sheets[n] = { file: (e.sheets[n] || {}).file, w: body.w, h: body.h, data: MK.b64d(body.data) }; return { ok: true }; }
      }
      if (rest[0] === 'snap' && method === 'POST') return snap(name, body);
      if (rest[0] === 'check' && method === 'POST') {
        const e = entry(name), kit = body && body.kit ? body.kit : e.kit;
        return WCHK.check(kit, name === S.name ? S.sheets : e.sheets, CAT, SCHEMA);
      }
    }
    throw new Error('not available in the web editor: ' + method + ' ' + url);
  };

  /* "save" keeps the edits in this page; the file itself leaves through the Save / export tab */
  MK.save = async function () {
    if (!S.kit) return;
    for (const n of S.dirtySheets) { const sh = S.sheets[n]; await MK.api('PUT', '/api/kit/' + S.name + '/sheet/' + n, { w: sh.w, h: sh.h, data: MK.b64e(sh.data) }); }
    S.dirtySheets = new Set();
    await MK.api('PUT', '/api/kit/' + S.name, S.kit);
    S.dirtyKit = false; MK.emit('dirty');
    MK.log('ok', 'kept in this page. Use "Save / export" to copy kit.json and the sheet PNGs out.');
  };

  /* ------------------------------------------------------------ opening kits */
  function addKit(kit, sheets) {
    const errs = WIO.validate(kit, SCHEMA);
    if (errs.length) fail('kit.json does not match the schema: ' + errs.slice(0, 6).join('; ') + (errs.length > 6 ? ' ...' : ''));
    W.store[kit.name] = { kit, sheets };
    return kit.name;
  }
  W.loadExample = function () { const e = WEX.build(); return addKit(e.kit, e.sheets); };

  async function gather(files) {
    const map = new Map();
    for (const f of files) {
      const file = f.file || f, path = f.path || file.webkitRelativePath || file.name, bytes = new Uint8Array(await file.arrayBuffer());
      if (/\.zip$/i.test(file.name)) { for (const z of await WIO.zipRead(bytes)) map.set(z.name.replace(/\\/g, '/'), z.bytes); }
      else map.set(path.replace(/\\/g, '/'), bytes);
    }
    return map;
  }
  async function kitFromFiles(files) {
    const map = await gather(files), paths = [...map.keys()];
    const cands = paths.filter((p) => /(^|\/)kit\.json$/i.test(p)).sort((a, b) => a.split('/').length - b.split('/').length);
    const js = cands[0] || (paths.filter((p) => /\.json$/i.test(p)).length === 1 ? paths.find((p) => /\.json$/i.test(p)) : null);
    if (!js) fail('no kit.json found among ' + plural(paths.length, 'file') + ' (select kit.json together with its sheet PNGs, or one .zip of the kit folder)');
    let kit;
    try { kit = JSON.parse(WIO.unutf8(map.get(js))); } catch (e) { fail(js + ' is not valid JSON: ' + e.message); }
    const base = js.includes('/') ? js.slice(0, js.lastIndexOf('/') + 1) : '';
    const sheets = [];
    for (const [n, s] of (Array.isArray(kit.sheets) ? kit.sheets : []).entries()) {
      const want = String(s.file || '');
      let bytes = map.get(base + want) || map.get(want);
      if (!bytes) { const bn = want.split('/').pop().toLowerCase(), hit = paths.find((p) => p.split('/').pop().toLowerCase() === bn); if (hit) bytes = map.get(hit); }
      if (!bytes) fail('sheet ' + n + ' (' + want + ') is missing: select its PNG together with kit.json');
      let ix;
      try { ix = await WIO.pngIndexed(bytes); } catch (e) { fail(want + ': ' + e.message); }
      if (ix) sheets.push({ file: want, w: ix.w, h: ix.h, data: ix.data });
      else {
        const cols = kit.palette && kit.palette.colors;
        if (!cols || !cols.length) fail(want + ' is an RGB PNG: the kit needs palette.colors to snap it to');
        const img = await WIO.imageRGBA(bytes), pal = cols.map((c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16))), d = new Uint8Array(img.w * img.h);
        for (let i = 0; i < d.length; i++) {
          if (img.rgba[i * 4 + 3] < 128) continue;
          let best = 1e12, bi = 0;
          pal.forEach((p, k) => { const dd = (img.rgba[i * 4] - p[0]) ** 2 + (img.rgba[i * 4 + 1] - p[1]) ** 2 + (img.rgba[i * 4 + 2] - p[2]) ** 2 + (k === 0 ? 1 : 0); if (dd < best) { best = dd; bi = k; } });
          d[i] = bi;
        }
        sheets.push({ file: want, w: img.w, h: img.h, data: d });
      }
    }
    return addKit(kit, sheets);
  }

  /* ask inside the page instead of a confirm dialog */
  W.guard = function (what, go) {
    if (!MK.isDirty()) { go(); return; }
    W.pending = { what, go }; renderBar();
  };
  function renderBar() {
    let bar = $('#confirmbar');
    if (!W.pending) { if (bar) bar.remove(); return; }
    if (!bar) { bar = h('div', { id: 'confirmbar', class: 'confirmbar', role: 'alertdialog', 'aria-label': 'Confirm' }); $('#app').append(bar); }
    clear(bar);
    bar.append(h('span', {}, 'You have unsaved edits to ' + S.name + '. ' + W.pending.what + ' would discard them. Copy kit.json first if you want to keep them.'),
      h('button', { class: 'primary', onclick: () => { const g = W.pending.go; W.pending = null; renderBar(); g(); } }, 'Discard and continue'),
      h('button', { onclick: () => { W.pending = null; renderBar(); } }, 'Keep editing'));
    const b = bar.querySelector('button'); if (b) b.focus();
  }

  async function openName(name) {
    await MK.loadKit(name); S.view = 'edit'; S.bottom = 'check'; MK.emit('view'); MK.renderBottom();
  }
  W.openFiles = function (files) {
    files = [...files];
    if (!files.length) return;
    W.guard('Opening another kit', async () => {
      W.msgs = [];
      try {
        MK.log('info', 'reading ' + plural(files.length, 'file') + ' ...');
        const name = await kitFromFiles(files);
        await openName(name);
        MK.log('ok', 'opened kit ' + name + ' from your disk (it stays in this page).');
      } catch (e) { W.msgs = [e.message]; MK.log('err', e.message); S.view = 'home'; renderHomeAgain(); }
    });
  };
  W.openExample = function () {
    W.guard('Loading the example kit', async () => { W.msgs = []; await openName(W.loadExample()); MK.log('info', 'Example kit loaded: drawn by code, not from the game.'); });
  };
  const renderHomeAgain = () => MK.emit('view');

  async function entriesOf(item) {                      // a dropped folder
    const out = [];
    const walk = async (en, path) => {
      if (en.isFile) { const f = await new Promise((res, rej) => en.file(res, rej)); out.push({ file: f, path: path + en.name }); }
      else if (en.isDirectory) {
        const rd = en.createReader();
        for (;;) { const batch = await new Promise((res, rej) => rd.readEntries(res, rej)); if (!batch.length) break; for (const c of batch) await walk(c, path + en.name + '/'); }
      }
    };
    await walk(item, '');
    return out;
  }

  /* ------------------------------------------------------------ UI */
  function pickers() {
    if ($('#webfiles')) return;
    const app = $('#app');
    app.append(
      h('input', { type: 'file', id: 'webfiles', multiple: true, accept: '.zip,.json,.png,application/zip,application/json,image/png', hidden: true, onchange: (e) => { const f = [...e.target.files]; e.target.value = ''; W.openFiles(f); } }),
      h('input', { type: 'file', id: 'webdir', webkitdirectory: true, hidden: true, onchange: (e) => { const f = [...e.target.files]; e.target.value = ''; W.openFiles(f); } }));
    const over = (e) => { if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files')) { e.preventDefault(); app.classList.add('dropping'); } };
    document.addEventListener('dragover', over);
    document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) app.classList.remove('dropping'); });
    document.addEventListener('drop', async (e) => {
      app.classList.remove('dropping');
      if (!e.dataTransfer || !e.dataTransfer.files.length) return;
      e.preventDefault();
      try {
        const items = [...(e.dataTransfer.items || [])].map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null));
        if (items.length && items.every(Boolean) && items.some((i) => i.isDirectory)) { let all = []; for (const it of items) all = all.concat(await entriesOf(it)); W.openFiles(all); }
        else W.openFiles(e.dataTransfer.files);
      } catch (err) { MK.log('err', err.message); }
    });
  }

  W.renderTopbar = function (top) {
    const isEx = S.kit && S.name === W.exampleName;
    top.append(h('b', { class: 'brand' }, 'Monster kit editor'),
      h('button', { onclick: () => $('#webfiles').click(), title: 'a .zip of a kit folder, or kit.json together with its sheet PNGs' }, 'Open kit ...'),
      h('button', { onclick: () => { S.view = S.view === 'home' && S.kit ? 'edit' : 'home'; MK.emit('view'); } }, S.view === 'home' && S.kit ? 'Back to the editor' : 'Help / more'),
      h('span', { class: 'kname' }, S.kit ? S.name : 'no kit open'),
      isEx ? h('span', { class: 'badge warn exbadge' }, 'Example kit (not from the game)') : '',
      h('span', { id: 'tier', class: 'badge' }, ''),
      h('span', { id: 'dirty', class: 'warn' }, ''),
      h('span', { class: 'grow' }),
      h('button', { id: 'btn-check', onclick: async () => { await MK.runCheck(true); S.bottom = 'check'; MK.renderBottom(); } }, 'Check'),
      h('button', { id: 'btn-save', class: 'primary', onclick: async () => { try { await MK.save(); } catch (e) { MK.log('err', e.message); } S.bottom = 'build'; MK.renderBottom(); const b = $('#bottom'); if (b && b.scrollIntoView) b.scrollIntoView({ block: 'nearest' }); } }, 'Save / export ...'));
  };
  W.paletteNote = function () {
    return S.name === W.exampleName ? h('div', { class: 'small warn' }, 'This is a neutral example palette, not the game palette. Open a kit to see its own colours.') : null;
  };

  W.renderHome = function (root) {
    clear(root);
    root.append(h('div', { class: 'home' },
      h('h2', {}, 'Monster kit editor, web edition'),
      h('p', { class: 'dim' }, 'Everything runs in this page. Your kit never leaves your computer: it is read from your disk, edited here and copied back out by you.'),
      W.msgs.length ? h('div', { class: 'bad', role: 'alert' }, W.msgs.map((m) => h('div', {}, m))) : null,
      h('h2', {}, 'Open a kit'),
      h('div', { class: 'dropzone', tabindex: '0', role: 'button', 'aria-label': 'Open a kit: choose files or drop them here', onclick: () => $('#webfiles').click(), onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#webfiles').click(); } } },
        h('b', {}, 'Drop a kit here, or click to choose'),
        h('div', { class: 'dim small' }, 'a .zip of a kit folder, or kit.json plus its sheet PNG(s) selected together, or a whole kit folder')),
      h('div', { class: 'btnrow wrap' },
        h('button', { class: 'primary', onclick: () => $('#webfiles').click() }, 'Choose files ...'),
        h('button', { onclick: () => $('#webdir').click() }, 'Choose a kit folder ...'),
        h('button', { onclick: () => W.openExample() }, 'Load the example kit'),
        S.kit ? h('button', { onclick: () => { S.view = 'edit'; MK.emit('view'); } }, 'Back to the editor') : null),
      Object.keys(W.store).length ? h('div', { class: 'kitlist' }, Object.values(W.store).map((e) => h('div', { class: 'kititem' },
        h('b', {}, e.kit.name), h('span', { class: 'dim' }, (e.kit.title || '') + ' - AI ' + e.kit.ai + ' - ' + plural(e.kit.celsets.length, 'cel set') + ', ' + plural(Object.keys(e.kit.animations).length, 'animation')),
        h('span', { class: 'grow' }),
        h('button', { onclick: () => W.guard('Switching kit', () => openName(e.kit.name)) }, 'Open')))) : null,
      h('h2', {}, 'How saving works here'),
      h('p', {}, 'This page runs in a sandbox that blocks downloads started by a page, so "Save" does not write a file. Instead, the Save / export tab gives you:'),
      h('ul', {}, h('li', {}, 'Copy kit.json: puts the kit description on the clipboard (if the browser refuses, a text box with the JSON is selected for Ctrl+C).'),
        h('li', {}, 'Per sheet: Copy PNG as data URL, and the PNG shown as an image you can right-click and "Save image as".'),
        h('li', {}, 'A .zip link as an extra; it may be blocked here, the copy buttons always work.')),
      h('p', { class: 'dim' }, 'Paste kit.json over the one in your kit folder and save the sheets next to it, then use py tools/monsterkit.py check / build on your PC. The check here is the same checklist without the original game data (sound ids are not checked).')));
  };

  /* ---- Save / export */
  function copyText(text, area, what) {
    const manual = (why) => { area.hidden = false; area.value = text; area.focus(); area.select(); try { document.execCommand('copy'); } catch (e) { /* manual copy */ } MK.log('info', 'Clipboard blocked' + (why ? ' (' + why + ')' : '') + ': ' + what + ' is selected in the box below, press Ctrl+C.'); };
    try {
      const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : null;
      if (!p) { manual('no clipboard API'); return; }
      p.then(() => MK.log('ok', 'Copied ' + what + ' (' + text.length + ' characters).')).catch((e) => manual(e && e.name));
    } catch (e) { manual(e && e.name); }
  }
  async function prepareExport() {
    const kit = S.kit, ver = S.ver + ':' + S.name;
    if (W.exp && W.exp.ver === ver) return W.exp;
    const exp = { ver, kitText: JSON.stringify(kit, null, 1) + '\n', sheets: [] };
    const cols = kit.palette.colors || [];
    for (let n = 0; n < kit.sheets.length; n++) {
      const sh = S.sheets[n];
      if (!sh) continue;
      const png = await WIO.pngEncode(sh.w, sh.h, sh.data, cols);
      exp.sheets.push({ n, file: kit.sheets[n].file, w: sh.w, h: sh.h, bytes: png, url: 'data:image/png;base64,' + MK.b64e(png) });
    }
    W.exp = exp;
    return exp;
  }
  W.renderExport = function (body) {
    const rep = S.report;
    const ta = h('textarea', { class: 'jsonbox', readonly: true, rows: 6, 'aria-label': 'kit.json text', spellcheck: 'false' });
    const zipbox = h('div', { class: 'small' });
    const sheets = h('div', { class: 'exsheets' }, h('div', { class: 'dim small' }, 'preparing the PNG sheets ...'));
    const copyBtn = h('button', { class: 'primary', disabled: true }, 'Copy kit.json');
    const zipBtn = h('button', { disabled: true, title: 'builds a .zip of the kit folder in memory and shows a download link' }, 'Prepare .zip (extra)');
    body.append(h('div', { class: 'exportwrap' },
      h('div', { class: 'exportctl' },
        h('div', { class: 'small dim' }, 'The sandbox this page runs in blocks downloads, so the files leave through the clipboard. Always exports the kit as it is now, including edits you did not "save".'),
        rep && !rep.ok ? h('div', { class: 'warn small' }, 'The check shows ' + plural(rep.errors.length, 'error') + ': the kit exports anyway, but the game build would be blocked.') : null,
        h('div', { class: 'btnrow wrap' }, copyBtn, zipBtn),
        zipbox,
        h('label', { class: 'small dim' }, 'kit.json (if the clipboard is blocked, select all and copy):'), ta),
      sheets));
    ta.hidden = false;
    prepareExport().then((exp) => {
      if (!ta.isConnected) return;
      ta.value = exp.kitText;
      copyBtn.disabled = false; zipBtn.disabled = false;
      copyBtn.addEventListener('click', () => copyText(exp.kitText, ta, 'kit.json'));
      zipBtn.addEventListener('click', () => {
        const files = [{ name: 'kit.json', bytes: WIO.utf8(exp.kitText) }].concat(exp.sheets.map((s) => ({ name: s.file, bytes: s.bytes })));
        const url = URL.createObjectURL(new Blob([WIO.zipWrite(files)], { type: 'application/zip' }));
        clear(zipbox).append(h('a', { href: url, download: S.name + '.zip' }, 'Download ' + S.name + '.zip'), ' (this may do nothing in the sandbox: use the copy buttons)');
      });
      clear(sheets);
      for (const s of exp.sheets) {

  function computeView(fr) {

    }

      const ci = MK.celset().frames;
      const oi = S.onion === 'prev' ? S.fi - 1 : S.fi + 1;
      const of = ci[oi];

        ctx.globalAlpha = 0.35;

        ctx.globalAlpha = 1;

    const px = MK.framePixels(fr);
    if (px) ctx.drawImage(MK.toCanvas(px.data, px.w, px.h, { hurt: S.hurt }), X(0), Y(0), w * z, ht * z);

  function eventPixel(ev) {

  function setPixel(fr, x, y, v) {

    const i = (ry + y) * sh.w + rx + x;

  function snapshot(fr) {

  }
  MK.undo = function () {
    const u = S.undo.pop();

    const fr = S.kit.celsets[u.ci].frames[u.fi];

  function nearPoint(fr, ev) {

  /* ---------------- toolbar */
  function toolbar() {
    const bar = h('div', { class: 'toolbar' });

      bar.append(h('button', { class: 'tool' + (S.tool === id ? ' on' : ''), title: tip, 'data-tool': id, onclick: () => { S.tool = id; MK.emit('center'); } }, label.replace(/ \(.\)/, '')));

  /* ---------------- sheet view */
  function renderSheetView(root) {

    root.append(h('div', { class: 'toolbar' }, h('span', { class: 'dim' }, 'Sheet of cel set ' + cs.slot + (cs.file ? ' (' + cs.file + ')' : '') + ': ' + sh.w + 'x' + sh.h + ' px, ' + cs.frames.length + ' frames. Click a frame to select it, double-click to edit it.'),
      h('label', {}, ' Zoom ', h('select', { onchange: (e) => { S.sheetZoom = +e.target.value; MK.emit('center'); } }, [1, 2, 3, 4].map((z) => h('option', { value: z, selected: z === (S.sheetZoom || 2) }, z + 'x'))))));

      return cs.frames.findIndex((f) => f.src && x >= f.src.rect[0] && x < f.src.rect[0] + f.src.rect[2] && y >= f.src.rect[1] && y < f.src.rect[1] + f.src.rect[3]);
    };
    cvs.addEventListener('click', (ev) => { const i = pick(ev); if (i >= 0) { S.fi = i; MK.emit('select'); } });
    cvs.addEventListener('dblclick', (ev) => { const i = pick(ev); if (i >= 0) { S.fi = i; S.center = 'frame'; MK.emit('select'); } });

  /* ---------------- import */
  MK.importPng = function (file) {

      try {

        S.imp = { name: file.name, w: r.w, h: r.h, data: MK.b64d(r.data), changed: MK.b64d(r.changed), counts: r.counts, src: String(rd.result), overlay: true };

  function applyImport(mode) {

  function renderImport(root) {

      h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: imp.overlay, onchange: (e) => { imp.overlay = e.target.checked; MK.emit('center'); } }), 'show changed pixels'),
      h('span', { class: 'sep' }),
      h('button', { class: 'primary', onclick: () => applyImport('frame') }, 'Apply to current frame'),
      h('button', { onclick: () => applyImport('sheet') }, 'Replace whole sheet'),
      h('button', { onclick: () => { S.imp = null; S.center = 'frame'; MK.emit('center'); } }, 'Cancel')));
    const z = Math.max(1, Math.min(4, Math.floor(600 / Math.max(imp.w, 1))));

    const a = h('canvas', { width: imp.w * z, height: imp.h * z, class: 'sheetcv' });
    const ctx = a.getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.fillStyle = '#262b36'; ctx.fillRect(0, 0, a.width, a.height); ctx.drawImage(snapped, 0, 0, imp.w * z, imp.h * z);
    const orig = h('img', { src: imp.src, class: 'sheetcv', style: 'width:' + imp.w * z + 'px;height:' + imp.h * z + 'px;image-rendering:pixelated;background:#262b36' });
    root.append(h('div', { class: 'canvaswrap two' }, h('div', {}, h('div', { class: 'dim' }, 'original'), orig), h('div', {}, h('div', { class: 'dim' }, 'snapped to the palette'), a)));
  }

  MK.renderCenter = function (root) {
    MK.clear(root);
    cv = null;
    const tabs = h('div', { class: 'tabs' }, [['frame', 'Frame'], ['sheet', 'Sprite sheet'], ['import', 'Import PNG']].map(([id, t]) =>
      h('button', { class: 'tab' + (S.center === id ? ' on' : ''), onclick: () => { S.center = id; MK.emit('center'); } }, t)));
    tabs.append(h('span', { class: 'grow' }));
    tabs.append(h('button', { onclick: () => $('#pngfile').click(), title: 'snap a PNG to the kit palette' }, 'Import PNG ...'));
    root.append(tabs);
    const body = h('div', { class: 'tabbody' });
    root.append(body);
    if (S.center === 'sheet') renderSheetView(body);
    else if (S.center === 'import') renderImport(body);
    else renderFrameView(body);
  };
  MK.fitZoom = function () {
    const fr = MK.frame(), wrap = $('.canvaswrap');
    if (!fr || !fr.src || !wrap) return;
    const v = computeView(fr), zs = [2, 3, 4, 6, 8, 10, 12, 16];
    let best = zs[0];
    for (const z of zs) if (v.w * z <= wrap.clientWidth - 24 && v.h * z <= wrap.clientHeight - 24) best = z;
    S.zoom = best;
    const sel = $('#zoom'); if (sel) sel.value = best;
    drawFrame();
  };
  MK.redrawFrame = drawFrame;
