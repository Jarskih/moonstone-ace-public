# tools/cell_names.yaml -- C++ names of the original data cells (ROADMAP 7.1s).  HUMAN-owned.
#
# Since ROADMAP 7.1r the game links no asm: `mog_LAB_0633` in C++ is a C++-owned cell (a link-time alias into the owned object that
# tools/gen_data.py generates).  A cell listed here is spelled with its C++ name everywhere (tools/rename_cells.py applies this file to
# the sources, tools/gen_data.py names the alias after it); a cell NOT listed keeps its `<bin>_LAB_xxxx` alias name.
#
#   binary:                   `mog` (the main game overlay) or `program` (intro / ending)
#     LAB_xxxx: cppName       # what it is; where the typed view lives (owned object, tools/data_types.yaml typed member)
#
# Naming: `mog` / `prg` + the thing; unknown cells in a known area keep the label number in the name (`mogUiRegionKind` = the long
# at +20 of the clickable-region record the UI builds).  The type of a cell is whatever each declaration says: the rename changes
# no type.  Names are unique over both binaries.  The `typed` members of the owned game state (asm/patches/mog.data_state.json)
# carry the same words: mogCurKnight is g_mogState.curKnight.

