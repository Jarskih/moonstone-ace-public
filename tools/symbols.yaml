# tools/symbols.yaml -- HUMAN-owned names for the routine table (ROADMAP 0.6).
# Generated facts (bounds, callers, registers, ...) live in build/inventory/routines.json,
# written by tools/routines.py, which validates this file and merges it in.
# binary -> label -> {name (snake_case), note, status (asm|lifted|idiomatic, default asm), source}.
# A name needs a `source` naming the evidence; leave a label unnamed rather than guess.
# Source paths are relative to D:\Amiga (DT = DOC_TECHNIQUE.md, DMI = DOC_MOTEUR_IMAGEXCEL.md,
# DMC = DOC_MODE_COMBAT.md, OF = ORIGINAL_FOUNDATION.md); the number is the line in that file.

